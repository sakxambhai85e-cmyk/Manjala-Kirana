<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मञ्जला किराना पसल - रिपोर्ट तथा डाटाबेस</title>
    <!-- html2canvas Library to generate bill images from database records -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #c0392b;
            --bg-color: #f4f6f7;
            --white: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: #333;
            padding: 10px;
        }
        .page {
            max-width: 650px;
            margin: 0 auto;
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: var(--primary-color);
            margin-bottom: 12px;
            text-align: center;
        }
        .card {
            background: #f9fbfb;
            border: 1px solid #dcdde1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
            font-size: 13px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        table, th, td {
            border: 1px solid #333;
        }
        th, td {
            padding: 7px;
            text-align: center;
            font-size: 12px;
        }
        th {
            background-color: #eaecee;
        }
        .database-table {
            overflow-x: auto;
        }
        .summary-box {
            background: #e8f8f5;
            border: 1px solid #27ae60;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 15px;
        }
        .btn {
            background-color: var(--accent-color);
            color: var(--white);
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .btn-danger {
            background-color: var(--danger-color);
        }
        .btn-secondary {
            background-color: #2980b9;
        }

        /* Hidden Receipt Template used to generate image snapshots on-the-fly */
        #hidden-receipt-container {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
        .receipt-template {
            width: 500px;
            background: #ffffff;
            padding: 20px;
            color: #333;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .receipt-header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .receipt-header h2 { font-size: 20px; color: #2c3e50; margin-bottom: 4px; }
        .receipt-header p { font-size: 12px; color: #555; }
        .receipt-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .receipt-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .receipt-table, .receipt-table th, .receipt-table td {
            border: 1px solid #333;
        }
        .receipt-table th, .receipt-table td {
            padding: 6px;
            font-size: 12px;
            text-align: center;
        }
        .receipt-table th { background-color: #eaecee; }
        .receipt-totals {
            float: right;
            width: 60%;
            font-size: 13px;
        }
        .receipt-total-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-weight: bold;
        }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>

    <div class="page">
        <h2>व्यापार रिपोर्ट तथा विश्लेषण (Analytics & Reports)</h2>

        <!-- SECTION 1: TURNOVER REPORT BY RANGE / TIME -->
        <div class="card">
            <h3>📈 कारोबार (Turnover) रिपोर्ट</h3>
            <div class="row">
                <div class="form-group">
                    <label>अवधि छान्नुहोस्:</label>
                    <select id="filter-period" onchange="toggleDateInputs()">
                        <option value="all">सबै (All Time)</option>
                        <option value="weekly">यो हप्ता (This Week)</option>
                        <option value="monthly">यो महिना (This Month)</option>
                        <option value="yearly">यो वर्ष (This Year)</option>
                        <option value="custom">तاريخ छान्नुहोस् (Custom Range)</option>
                    </select>
                </div>
            </div>
            <div id="custom-date-box" class="row" style="display: none;">
                <div class="form-group">
                    <label>देखि (From):</label>
                    <input type="date" id="date-from" onchange="calculateTurnover()">
                </div>
                <div class="form-group">
                    <label>सम्म (To):</label>
                    <input type="date" id="date-to" onchange="calculateTurnover()">
                </div>
            </div>
            <div class="summary-box" id="turnover-display">
                कुल कारोबार: रु 0.00
            </div>
        </div>

        <!-- SECTION 2: SEARCH OPTIONS -->
        <div class="card">
            <h3>🔍 बिल, सामान वा ग्राहक खोज्नुहोस्</h3>
            <div class="form-group">
                <label>बिल नम्बर (Bill Number Search):</label>
                <input type="text" id="search-billno" placeholder="जस्तै: 00001..." oninput="filterData()">
            </div>
            <div class="form-group">
                <label>सामानको नाम (Item Sales Search):</label>
                <input type="text" id="search-item" placeholder="जस्तै: चिनी, चामल..." oninput="filterData()">
            </div>
            <div class="form-group">
                <label>ग्राहकको नाम (Customer Purchase History):</label>
                <input type="text" id="search-customer" placeholder="ग्राहकको नाम..." oninput="filterData()">
            </div>
        </div>

        <!-- SECTION 3: BILLS DATABASE TABLE -->
        <h3>बिलहरूको सूची</h3>
        <div class="database-table">
            <table>
                <thead>
                    <tr>
                        <th>बिल नं</th>
                        <th>मिति</th>
                        <th>ग्राहक</th>
                        <th>कुल रकम</th>
                        <th>कार्य</th>
                    </tr>
                </thead>
                <tbody id="database-rows">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>

        <button class="btn btn-secondary" onclick="window.location.href='homepage.html'">⬅️ गृहपृष्ठमा फर्कनुहोस्</button>
    </div>

    <!-- Hidden Container to render image snapshot -->
    <div id="hidden-receipt-container"></div>

    <script>
        let billsDatabase = JSON.parse(localStorage.getItem('karobar_bills')) || [];

        function toggleDateInputs() {
            const period = document.getElementById('filter-period').value;
            const customBox = document.getElementById('custom-date-box');
            customBox.style.display = (period === 'custom') ? 'flex' : 'none';
            calculateTurnover();
            filterData();
        }

        function calculateTurnover() {
            const period = document.getElementById('filter-period').value;
            const now = new Date();
            let total = 0;

            billsDatabase.forEach(bill => {
                const billDate = new Date(bill.date);
                let include = false;

                if (period === 'all') {
                    include = true;
                } else if (period === 'weekly') {
                    const oneWeekAgo = new Date();
                    oneWeekAgo.setDate(now.getDate() - 7);
                    if (billDate >= oneWeekAgo && billDate <= now) include = true;
                } else if (period === 'monthly') {
                    if (billDate.getMonth() === now.getMonth() && billDate.getFullYear() === now.getFullYear()) include = true;
                } else if (period === 'yearly') {
                    if (billDate.getFullYear() === now.getFullYear()) include = true;
                } else if (period === 'custom') {
                    const from = document.getElementById('date-from').value;
                    const to = document.getElementById('date-to').value;
                    if (from && to && bill.date >= from && bill.date <= to) include = true;
                }

                if (include) {
                    total += parseFloat(bill.grandTotal) || 0;
                }
            });

            document.getElementById('turnover-display').textContent = `कुल कारोबार: रु ${total.toFixed(2)}`;
        }

        function filterData() {
            const billNoQuery = document.getElementById('search-billno').value.toLowerCase().trim();
            const itemQuery = document.getElementById('search-item').value.toLowerCase().trim();
            const customerQuery = document.getElementById('search-customer').value.toLowerCase().trim();
            const tbody = document.getElementById('database-rows');
            tbody.innerHTML = '';

            let filteredBills = billsDatabase.filter(bill => {
                let matchesBillNo = (bill.billNo || '').toLowerCase().includes(billNoQuery);
                let matchesCustomer = (bill.customerName || '').toLowerCase().includes(customerQuery);
                let matchesItem = true;

                if (itemQuery) {
                    matchesItem = bill.items.some(item => (item.desc || '').toLowerCase().includes(itemQuery));
                }

                return matchesBillNo && matchesCustomer && matchesItem;
            });

            if (filteredBills.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5">कुनै पनि रेकर्ड फेला परेन।</td></tr>`;
                return;
            }

            filteredBills.forEach((bill) => {
                const originalIndex = billsDatabase.indexOf(bill);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${bill.billNo}</b></td>
                    <td>${bill.date}</td>
                    <td>${bill.customerName}</td>
                    <td>रु ${bill.grandTotal}</td>
                    <td>
                        <button class="btn" style="background-color: #2980b9; padding: 4px 6px; font-size: 11px; margin-bottom: 2px; width: 100%;" onclick="generateReceiptImage('${bill.billNo}')">📸 फोटो</button>
                        <button class="btn-danger" style="padding: 4px 6px; font-size: 11px; border:none; border-radius:3px; color:white; cursor:pointer; width: 100%;" onclick="deleteBill(${originalIndex})">मेटाउने</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteBill(index) {
            if (confirm('के तपाईँ यो बिल मेटाउन चाहनुहुन्छ?')) {
                billsDatabase.splice(index, 1);
                localStorage.setItem('karobar_bills', JSON.stringify(billsDatabase));
                calculateTurnover();
                filterData();
            }
        }

        function generateReceiptImage(billNo) {
            const bill = billsDatabase.find(b => b.billNo === billNo);
            if (!bill) return;

            const container = document.getElementById('hidden-receipt-container');
            
            let itemsHtml = '';
            bill.items.forEach((item, i) => {
                itemsHtml += `
                    <tr>
                        <td>${i+1}</td>
                        <td style="text-align: left; padding-left: 6px;">${item.desc}</td>
                        <td>${item.qty}</td>
                        <td>${item.rate}</td>
                        <td>${item.amount}</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="receipt-template" id="capture-receipt">
                    <div class="receipt-header">
                        <h2>मञ्जला किराना पसल</h2>
                        <p>शान्ति टोल, सुन्दरहरैंचा, वार्ड नं ९, मोरङ</p>
                        <p>स्थायी लेखा नम्बर (PAN): ६२४४१६०७०</p>
                    </div>
                    <div class="receipt-info">
                        <div><b>बिल नं:</b> ${bill.billNo}</div>
                        <div><b>मिति:</b> ${bill.date}</div>
                    </div>
                    <div style="font-size: 13px; margin-bottom: 8px;">
                        <div><b>ग्राहकको नाम:</b> ${bill.customerName}</div>
                        <div><b>ठेगाना:</b> ${bill.customerAddress}</div>
                    </div>
                    <table class="receipt-table">
                        <thead>
                            <tr>
                                <th style="width: 8%;">सि.नं.</th>
                                <th style="width: 42%;">विवरण</th>
                                <th style="width: 15%;">परिमाण</th>
                                <th style="width: 15%;">दर</th>
                                <th style="width: 20%;">रकम</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>
                    <div class="clearfix">
                        <div class="receipt-totals">
                            <div class="receipt-total-row" style="border-top: 1px solid #333; padding-top: 4px;">
                                <span>कुल जम्मा (Grand Total):</span>
                                <span>रु ${bill.grandTotal}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                html2canvas(document.getElementById('capture-receipt'), { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `bill_${bill.billNo}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg');
                    link.click();
                    container.innerHTML = '';
                });
            }, 200);
        }

        // Initial load
        calculateTurnover();
        filterData();
    </script>
</body>
    </html>
