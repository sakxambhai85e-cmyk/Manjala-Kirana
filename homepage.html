<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मञ्जला किराना पसल - गृहपृष्ठ</title>
    <!-- html2canvas Library to capture bill as Image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #c0392b;
            --bg-color: #f4f6f7;
            --white: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: #333;
            padding: 10px;
        }
        .page {
            max-width: 600px;
            margin: 0 auto;
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header-box {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header-box h1 {
            font-size: 22px;
            color: var(--primary-color);
        }
        .header-box p {
            font-size: 13px;
            color: #555;
        }
        .bill-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        table, th, td {
            border: 1px solid #333;
        }
        th, td {
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #eaecee;
        }
        .totals-section {
            float: right;
            width: 60%;
            margin-bottom: 20px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        .btn {
            background-color: var(--accent-color);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-danger {
            background-color: var(--danger-color);
        }
        .btn-secondary {
            background-color: #2980b9;
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-email {
            background-color: #e67e22;
        }
        .actions-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Printable Bill Receipt Area -->
    <div class="page" id="bill-receipt">
        <div class="header-box">
            <h1>मञ्जला किराना पसल</h1>
            <p>शान्ति टोल, सुन्दरहरैंचा, वार्ड नं ९, मोरङ</p>
            <p>स्थायी लेखा नम्बर (PAN): ६२४४१६०७०</p>
        </div>

        <div class="bill-info">
            <div><label>बिल नं: <span id="display-bill-no">00001</span></label></div>
            <div><label>मिति: <input type="date" id="bill-date" style="padding: 2px; font-size: 12px; border:none; background:transparent;"></label></div>
        </div>

        <div class="form-group">
            <label>ग्राहकको नाम:</label>
            <input type="text" id="customer-name" placeholder="ग्राहकको नाम लेख्नुहोस्">
        </div>
        <div class="form-group">
            <label>ठेगाना:</label>
            <input type="text" id="customer-address" placeholder="ठेगाना लेख्नुहोस्">
        </div>
        <div class="form-group">
            <label>इमेल ठेगाना (Email):</label>
            <input type="email" id="customer-email" placeholder="customer@gmail.com">
        </div>

        <h4 style="margin: 15px 0 5px 0;">सामानको विवरण</h4>
        <table id="bill-items-table">
            <thead>
                <tr>
                    <th>सि.नं.</th>
                    <th>विवरण (Particulars)</th>
                    <th>परिमाण</th>
                    <th>दर</th>
                    <th>रकम</th>
                </tr>
            </thead>
            <tbody id="items-body">
                <tr>
                    <td>1</td>
                    <td><input type="text" class="item-desc" style="border:none; width:100%; text-align:center;" placeholder="सामानको नाम"></td>
                    <td><input type="number" class="item-qty" style="border:none; width:100%; text-align:center;" value="1" oninput="calculateTotals()"></td>
                    <td><input type="number" class="item-rate" style="border:none; width:100%; text-align:center;" value="0" oninput="calculateTotals()"></td>
                    <td class="item-amount">0</td>
                </tr>
            </tbody>
        </table>
        <button class="btn btn-secondary no-print" style="padding: 6px; font-size: 13px; margin-bottom: 15px;" onclick="addRow()">+ अर्को सामान थप्नुहोस्</button>

        <div class="clearfix">
            <div class="totals-section">
                <div class="total-row">
                    <span>जम्मा (Total):</span>
                    <span id="sub-total">0</span>
                </div>
                <div class="total-row">
                    <span>छुट (Discount):</span>
                    <input type="number" id="discount" value="0" style="width: 80px; text-align: right; border:1px solid #ccc; padding:2px;" oninput="calculateTotals()">
                </div>
                <div class="total-row" style="border-top: 2px solid #333; padding-top: 5px;">
                    <span>कुल जम्मा (Grand Total):</span>
                    <span id="grand-total">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons Bar Outside Receipt Container -->
    <div class="page" style="margin-top: 15px; background: transparent; box-shadow: none; padding: 0;">
        <div class="actions-bar">
            <button class="btn" id="btn-save" onclick="saveBill()">💾 सेभ र बिल बनाउनुहोस्</button>
            <button class="btn btn-secondary" id="btn-img" onclick="downloadImage()" disabled>📥 बिलको फोटो डाउनलोड गर्नुहोस्</button>
            <button class="btn btn-whatsapp" id="btn-whatsapp" onclick="shareWhatsApp()" disabled>📱 व्हाट्सएपमा सेयर</button>
            <button class="btn btn-email" id="btn-email" onclick="sendEmail()" disabled>📧 इमेल पठाउनुहोस्</button>
            <button class="btn btn-secondary" onclick="window.location.href='database.html'">📊 डाटाबेस हेर्नुहोस्</button>
            <button class="btn btn-danger" onclick="window.location.href='index.html'">लगआउट गर्नुहोस्</button>
        </div>
    </div>

    <script>
        document.getElementById('bill-date').valueAsDate = new Date();
        let billsDatabase = JSON.parse(localStorage.getItem('karobar_bills')) || [];
        let billGenerated = false;

        // Set bill number with 5-digit padding (e.g., 00001, 00002)
        const nextBillNum = String(billsDatabase.length + 1).padStart(5, '0');
        document.getElementById('display-bill-no').textContent = nextBillNum;

        function addRow() {
            const tbody = document.getElementById('items-body');
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rowCount}</td>
                <td><input type="text" class="item-desc" style="border:none; width:100%; text-align:center;" placeholder="सामानको नाम"></td>
                <td><input type="number" class="item-qty" style="border:none; width:100%; text-align:center;" value="1" oninput="calculateTotals()"></td>
                <td><input type="number" class="item-rate" style="border:none; width:100%; text-align:center;" value="0" oninput="calculateTotals()"></td>
                <td class="item-amount">0</td>
            `;
            tbody.appendChild(tr);
        }

        function calculateTotals() {
            const rows = document.querySelectorAll('#items-body tr');
            let subTotal = 0;

            rows.forEach(row => {
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const amount = qty * rate;
                row.querySelector('.item-amount').textContent = amount.toFixed(2);
                subTotal += amount;
            });

            document.getElementById('sub-total').textContent = subTotal.toFixed(2);
            const discount = parseFloat(document.getElementById('discount').value) || 0;
            const grandTotal = subTotal - discount;
            document.getElementById('grand-total').textContent = grandTotal.toFixed(2);
        }

        function saveBill() {
            const billNo = document.getElementById('display-bill-no').textContent;
            const date = document.getElementById('bill-date').value;
            const customerName = document.getElementById('customer-name').value || 'साधारण ग्राहक';
            const customerAddress = document.getElementById('customer-address').value || '-';
            const customerEmail = document.getElementById('customer-email').value || '';
            const grandTotal = document.getElementById('grand-total').textContent;

            const rows = document.querySelectorAll('#items-body tr');
            let items = [];
            rows.forEach(row => {
                items.push({
                    desc: row.querySelector('.item-desc').value || 'सामान',
                    qty: row.querySelector('.item-qty').value || '1',
                    rate: row.querySelector('.item-rate').value || '0',
                    amount: row.querySelector('.item-amount').textContent || '0'
                });
            });

            const billData = { billNo, date, customerName, customerAddress, customerEmail, items, grandTotal };
            billsDatabase.push(billData);
            localStorage.setItem('karobar_bills', JSON.stringify(billsDatabase));

            billGenerated = true;
            document.getElementById('btn-img').removeAttribute('disabled');
            document.getElementById('btn-whatsapp').removeAttribute('disabled');
            document.getElementById('btn-email').removeAttribute('disabled');
            document.getElementById('btn-save').setAttribute('disabled', 'true');

            alert('बिल सफलतापूर्वक सेभ भयो!');
        }

        function downloadImage() {
            if (!billGenerated) return;
            const receipt = document.getElementById('bill-receipt');
            html2canvas(receipt).then(canvas => {
                const link = document.createElement('a');
                link.download = `bill_${document.getElementById('display-bill-no').textContent}.jpg`;
                link.href = canvas.toDataURL('image/jpeg');
                link.link;
                link.click();
            });
        }

        function shareWhatsApp() {
            if (!billGenerated) return;

            const customerName = document.getElementById('customer-name').value || 'ग्राहक';
            const billNo = document.getElementById('display-bill-no').textContent;
            const grandTotal = document.getElementById('grand-total').textContent;
            
            const rows = document.querySelectorAll('#items-body');
            let itemDetails = '';
            document.querySelectorAll('#items-body tr').forEach((row, i) => {
                const desc = row.querySelector('.item-desc').value || 'सामान';
                const qty = row.querySelector('.item-qty').value || '1';
                const amt = row.querySelector('.item-amount').textContent || '0';
                itemDetails += `\n${i+1}. ${desc} (${qty} pc) - रु ${amt}`;
            });

            const text = encodeURIComponent(`*मञ्जला किराना पसल* \nबिल नं: ${billNo}\nग्राहक: ${customerName}\n-------------------${itemDetails}\n-------------------\n*कुल जम्मा: रु ${grandTotal}*\nधन्यवाद!`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function sendEmail() {
            if (!billGenerated) return;
            const email = document.getElementById('customer-email').value;
            const customerName = document.getElementById('customer-name').value || 'ग्राहक';
            const billNo = document.getElementById('display-bill-no').textContent;
            const grandTotal = document.getElementById('grand-total').textContent;

            const subject = encodeURIComponent(`मञ्जला किराना पसल - बिल नं ${billNo}`);
            const body = encodeURIComponent(`नमस्ते ${customerName},\n\nतपाईँको मञ्जला किराना पसलको कुल बिल रकम रु ${grandTotal} रहेको छ।\n\nधन्यवाद!`);
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }
    </script>
</body>
</html>
