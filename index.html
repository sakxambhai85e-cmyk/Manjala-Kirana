<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मञ्जला किराना पसल - लगइन</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #c0392b;
            --bg-color: #f4f6f7;
            --white: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 15px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-card h2 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 24px;
        }
        .login-card p {
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 13px;
            color: #444;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .btn {
            background-color: var(--accent-color);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #219653;
        }
        .error-msg {
            color: var(--danger-color);
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>मञ्जला किराना पसल</h2>
        <p>कारोबार व्यवस्थापन प्रणालीमा स्वागत छ</p>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>प्रयोगकर्ता नाम (Username):</label>
                <input type="text" id="username" placeholder="Username हाल्नुहोस्" required>
            </div>
            <div class="form-group">
                <label>पासवर्ड (Password):</label>
                <input type="password" id="password" placeholder="Password हाल्नुहोस्" required>
            </div>
            <button type="submit" class="btn">लगइन गर्नुहोस् (Login)</button>
            <div id="error-message" class="error-msg">गलत प्रयोगकर्ता नाम वा पासवर्ड! कृपया फेरि प्रयास गर्नुहोस्।</div>
        </form>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOpqfC82JPj3et5q5Bx4ROcqGK_QT7DnQ",
            authDomain: "karobarapp-950e8.firebaseapp.com",
            projectId: "karobarapp-950e8",
            storageBucket: "karobarapp-950e8.firebasestorage.app",
            messagingSenderId: "590048865310",
            appId: "1:590048865310:web:af35ec728e1829254920f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Update your form labels/inputs in index.html from Username to Email if using Firebase Auth, 
        // or keep text input if mapping username to a specific email format like manjala@karobar.com
        window.handleLogin = async function(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-message');

            // Convert username input into a standard Firebase email format, or use an email field
            const email = user.includes('@') ? user : `${user.toLowerCase()}@karobar.com`;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = 'homepage.html';
            } catch (error) {
                errorMsg.style.display = 'block';
                console.error(error.message);
            }
        }
    </script>

</body>
</html>
